# Єдиний публічний вхід до frontend і BFF. X-Forwarded-For перезаписується
# адресою з'єднання: значення від клієнта не доходить до ліміту логіну.
resolver 127.0.0.11 valid=10s;
server_tokens off;

server {
    listen 3000;

    location / {
        # Змінна змушує перечитувати DNS після перестворення контейнера.
        set $upstream http://frontend:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server Components стрімлять Suspense-секції.
        proxy_buffering off;
    }
}

server {
    listen 3004;

    location / {
        set $upstream http://bff:3004;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
