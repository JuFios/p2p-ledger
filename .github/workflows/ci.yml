name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  system-e2e:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/solution'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: p2p-ledger-system
      COMPOSE_FILE: docker-compose.yml:docker-compose.test.yml
    steps:
      - uses: actions/checkout@v4
      - name: Build test runner
        run: docker compose build system-tests
      - name: Check test package
        run: docker compose run --rm --no-deps system-tests sh -c 'npm run lint && npx tsc --noEmit'
      - name: Start complete stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: System tests
        run: docker compose run --rm --no-deps system-tests npm test
      - name: Concurrent double spend test
        run: docker compose run --rm --no-deps system-tests npm run test:load
      - name: Diagnose failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=100
      - name: Remove test containers and volumes
        if: always()
        run: docker compose --profile test down -v --remove-orphans

  ledger-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/ledger-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/ledger-service/package-lock.json
      - run: node ../../scripts/sync-contracts.cjs --check
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:e2e
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: ledger
          DATABASE_PASSWORD: ledger
          DATABASE_NAME: ledger
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
          INTERNAL_API_TOKEN: ci-internal-token
          ADMIN_EMAIL: e2e-admin@example.com
          ADMIN_PASSWORD: e2e-admin-password
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  payments-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
          POSTGRES_DB: payments
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payments -d payments"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/payments-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/payments-service/package-lock.json
      - run: node ../../scripts/sync-contracts.cjs --check
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:e2e
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: payments
          DATABASE_PASSWORD: payments
          DATABASE_NAME: payments
          JWT_ACCESS_SECRET: ci-access-secret

  notifications-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notifications
          POSTGRES_PASSWORD: notifications
          POSTGRES_DB: notifications
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notifications -d notifications"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/notifications-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/notifications-service/package-lock.json
      - run: node ../../scripts/sync-contracts.cjs --check
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:e2e
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: notifications
          DATABASE_PASSWORD: notifications
          DATABASE_NAME: notifications
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: ci-access-secret

  bff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/bff/package-lock.json
      - run: node ../../scripts/sync-contracts.cjs --check
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: node ../../scripts/sync-contracts.cjs --check
      - run: npm ci
      - run: npm run lint
      # next build робить типчек
      - run: npm run build
      - run: npm test
