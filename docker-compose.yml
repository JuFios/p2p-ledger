version: '3.8'

services:
  ledger-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - ledger-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ledger -d ledger']
      interval: 5s
      timeout: 3s
      retries: 10

  payments-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - payments-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payments -d payments']
      interval: 5s
      timeout: 3s
      retries: 10

  notifications-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
      POSTGRES_DB: notifications
    ports:
      - '127.0.0.1:5435:5432'
    volumes:
      - notifications-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notifications -d notifications']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/jaeger:2.8.0
    ports:
      - '127.0.0.1:16686:16686'
      - '127.0.0.1:4318:4318'

  ledger-service:
    build: ./apps/ledger-service
    env_file: ./apps/ledger-service/.env.example
    environment:
      DATABASE_HOST: ledger-db
    depends_on:
      ledger-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:3001:3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

  payments-service:
    build: ./apps/payments-service
    env_file: ./apps/payments-service/.env.example
    depends_on:
      payments-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ledger-service:
        condition: service_started
    ports:
      - '127.0.0.1:3002:3002'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3002/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

  notifications-service:
    build: ./apps/notifications-service
    env_file: ./apps/notifications-service/.env.example
    depends_on:
      notifications-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:3003:3003'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3003/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

  bff:
    build: ./apps/bff
    env_file: ./apps/bff/.env.example
    depends_on:
      ledger-service:
        condition: service_healthy
      payments-service:
        condition: service_healthy
      notifications-service:
        condition: service_healthy
    ports:
      - '127.0.0.1:3004:3004'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3004/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./apps/frontend
    env_file: ./apps/frontend/.env.example
    environment:
      BFF_URL: http://bff:3004
      WS_PUBLIC_URL: http://localhost:3003
    depends_on:
      bff:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  redis-data:
  ledger-db-data:
  payments-db-data:
  notifications-db-data:
