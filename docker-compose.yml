version: '3.8'

services:
  ledger-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - '5433:5432'
    volumes:
      - ledger-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ledger -d ledger']
      interval: 5s
      timeout: 3s
      retries: 10

  payments-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - '5434:5432'
    volumes:
      - payments-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payments -d payments']
      interval: 5s
      timeout: 3s
      retries: 10

  notifications-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
      POSTGRES_DB: notifications
    ports:
      - '5435:5432'
    volumes:
      - notifications-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notifications -d notifications']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  ledger-service:
    build: ./apps/ledger-service
    env_file: ./apps/ledger-service/.env.example
    environment:
      DATABASE_HOST: ledger-db
    depends_on:
      ledger-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

  payments-service:
    build: ./apps/payments-service
    env_file: ./apps/payments-service/.env.example
    depends_on:
      payments-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ledger-service:
        condition: service_started
    ports:
      - '3002:3002'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3002/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

  notifications-service:
    build: ./apps/notifications-service
    env_file: ./apps/notifications-service/.env.example
    ports:
      - '3003:3003'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3003/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./apps/frontend
    env_file: ./apps/frontend/.env.example
    environment:
      LEDGER_SERVICE_URL: http://ledger-service:3001
      PAYMENTS_SERVICE_URL: http://payments-service:3002
    depends_on:
      - ledger-service
      - payments-service
    ports:
      - '3000:3000'

volumes:
  ledger-db-data:
  payments-db-data:
  notifications-db-data:
